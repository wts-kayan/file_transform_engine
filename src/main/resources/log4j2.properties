# Log4j2 config for local runs of the file_transform_engine jobs.
# Spark 3.5 ships log4j2; this keeps Spark/Hadoop quiet (WARN) while showing
# this application's INFO messages (Start / End / write / harmonize) for every
# module under com.bnp.str (tseadfwd, addons, utilities, ...).

status = warn
name = EadFwdLogging

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# keep the framework noise down
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

# this application's packages at INFO (covers tseadfwd, addons, and future modules)
logger.app.name = com.bnp.str
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = console
