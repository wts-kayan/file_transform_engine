# Log4j2 config for local runs of the file_transform_engine jobs.
# Spark 3.5 ships log4j2; this keeps Spark/Hadoop quiet (WARN) while showing
# this application's INFO messages (Start / End / write / harmonize) for every
# module under com.bnp.str (tseadfwd, addons, utilities, ...).
#
# ON YARN — two things to know:
#
# 1. These logs go to the container's *stderr* file, not stdout (see target below,
#    which matches Spark's own default). An empty `stdout` in the YARN UI is normal;
#    read `stderr`, or `yarn logs -applicationId <id>` which concatenates both.
#    Switch `target` to SYSTEM_OUT below if you would rather have them in stdout.
#
# 2. This file only applies if it wins the classpath. The cluster's own
#    $SPARK_CONF_DIR/log4j2.properties usually comes first, in which case these
#    levels are ignored. To force it, ship it and point log4j at it:
#
#      spark-submit … \
#        --files log4j2.properties \
#        --conf spark.driver.extraJavaOptions=-Dlog4j.configurationFile=log4j2.properties \
#        --conf spark.executor.extraJavaOptions=-Dlog4j.configurationFile=log4j2.properties

status = warn
name = EadFwdLogging

appender.console.type = Console
appender.console.name = console
# SYSTEM_ERR mirrors Spark's default, so app and framework logs stay in one stream
# (the YARN container's stderr). Use SYSTEM_OUT to route them to stdout instead.
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# keep the framework noise down
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

# this application's packages at INFO (covers tseadfwd, addons, and future modules)
logger.app.name = com.bnp.str
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = console
