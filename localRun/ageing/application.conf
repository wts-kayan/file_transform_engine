ageing_macroeconomic_scenarios_app {
    macroeconomic {
        path = "localRun/ageing/input/MAIWENN_EXP_INPUT_scn_ifrs9_25Q2_Def15may_secto_v9.xlsx"
    }

    as_of_date {
        initial = "2025Q2"
        ageing = "2027Q4"
    }

    output {
      macroeconomic {
        # Excel workbook: one sheet per scenario, mirroring the input layout.
        path = "localRun/ageing/output/MAIWENN_EXP_INPUT_scn_ifrs9_25Q2_Def15may_secto_v9_output.xlsx"
        # Single CSV holding every scenario, tagged by a `scenario` column placed after `Date`.
        # Optional: when omitted, the CSV is written next to the workbook under the same base name.
        csv_path = "localRun/ageing/output/MAIWENN_EXP_INPUT_scn_ifrs9_25Q2_Def15may_secto_v9_output.csv"
      }
    }

    technical {
        is_local = "true"
    }

    # Every run records one row into the `run_history` EXTERNAL Hive table (shared, module-agnostic),
    # partitioned by (module_name, run_id). Launcher metadata may be given here or injected per-run via
    # -Drun.userLauncher / -Drun.motor / -Drun.usedJar / RUN_USER_LAUNCHER / RUN_MOTOR / RUN_USED_JAR.
    audit {
        enabled  = true
        # database = "dbiris"              # Hive db (qualifies the table + derives LOCATION); omitted here
                                           #   so the local run falls back to `root` (no metastore needed)
        table    = "run_history"
        root     = "localRun/run_history"  # LOCATION when `database` is unset / metastore absent
        userLauncher = "j03627"
        motor        = "ageing"
    }
}
