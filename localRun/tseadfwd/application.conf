tseadfwd_app {

  # RA input — the sheets are DISCOVERED in the workbook, not listed here.
  #
  # Every RA sheet carries a PERIMETER column, so the entity comes from the sheet's CONTENT and the
  # sheet NAME is only an address. When the business adds an entity tab (RA_XYZ) it is picked up on
  # the next run: no code change, no change to this file. PARAMETRAGE then decides which of those
  # perimeters produce matrices — an entity present in RA but absent from PARAMETRAGE produces
  # nothing and is reported by the DATA CONTROL check `RA.perimeters`.
  #
  # Remove this whole block to fall back to the per-entity RA_* blocks below.
  RA {
    # Workbooks to look in, IN ORDER. The order is the duplicate rule: the same sheet name in two
    # workbooks is loaded from the FIRST one listed (RA_BCEF exists in both files below, and loading
    # a perimeter twice would double its rows — the `RA.duplicateKeys` control FAILs on that).
    paths = [
      "localRun/tseadfwd/input/Inputs_RA_v4.xlsx"
    ]

    # Gate 1, on the NAME: case-insensitive regex a sheet must match to be a candidate. The default
    # keeps out the non-data tabs real workbooks carry (e.g. a divider named "Inputs RA ->").
    sheetPattern = "^RA[_ ].*"

    # Gate 2, on the CONTENT: a candidate is loaded only if it actually carries these columns. A tab
    # that matches the name but is not an RA table is skipped with a warning, never fed to the union.
    requireColumns = ["PERIMETER", "SEGMENT", "RATE_TYPE", "FWL_TYPE", "METRIC"]

    # Escape hatches, both normally empty. NOTE the key names: `include` is a HOCON keyword, so a
    # bare `include = [...]` would make this whole file fail to parse.
    #   includeSheets — load these sheets whatever the pattern says
    #   excludeSheets — never load these (e.g. a retired entity still sitting in the workbook)
    includeSheets = []
    excludeSheets = []
  }


  PARAMETRAGE {
    path = "localRun/tseadfwd/input/PARAMETRAGE_corrected.xlsx"
    sheetNames = PARAMETRAGE
  }

  # Scenario — workbook with ONE SHEET PER SCENARIO (read + unioned by readScenarioFromExcelSheets).
  MACRO_VARIABLE {
    path = "localRun/tseadfwd/input/Scenario_EAD_FWD.xlsx"
    sheetNames = ["Central", "Adverse", "Optimistic", "Extreme"]
  }

  # Engine run parameters (computation settings, not inputs/outputs).
  parameters {
    # Projection start quarter = term 0 (the as-of date). The FWL=YES shock reads the scenario macro
    # path from here, one step per quarter. (Renamed from shock_window_start.)
    as_of_date_quarter = "2025Q4"
    # Fallback last quarter of the projection horizon — used ONLY when a matrix's PARAMETRAGE
    # PROJECTION_HORIZON cell is blank. Normally the shock-window end is derived per matrix as
    # as_of_date_quarter + PROJECTION_HORIZON (e.g. 2025Q4 + "3Y" = 2028Q4). (Renamed from shock_window_end.)
    last_quarter_projection_horizon = "2028Q4"

    # FWL=YES scenario shock interpretation (schema): true = scale the stress-vs-baseline shock by the
    # macro Rate/100 (Adverse != Extreme; magnitude follows the macro path); false = full shock, no Rate
    # (literal STEP-4 cells; Adverse = Extreme). Kept to compare both readings with the business output.
    apply_rate_to_shock = true

    # Unit scale on the per-term macro delta (scenario - Central) before it scales the FWL=YES shock.
    # The raw macro difference is in the scenario file's native unit; this converts it to the unit the
    # shock expects. Default 1.0 (raw) when absent; 10000 turns a 0.00025 raw delta into 2.5.
    macro_delta_scale = 100

    # When true, drop output rows whose final EAD_RA_RATE >= 1 (full-exposure terms — leading terms
    # before any loss accrues, and any run-off backstop term). Default false (emit every term).
    # The filtering itself now happens in the coherence-check mapper, AFTER the business rules have
    # seen the complete curve (rule CR01 needs the full-exposure rows to be able to report them).
    exclude_ead_ra_rate_ge_1 = true

    # When true, a NEGATIVE EAD_RA_RATE is emitted as computed instead of being reported as 1, so
    # coherence-check rule CR02 has something to report. This disables BOTH the run-off freeze (the RA
    # series is no longer truncated at the first RA >= 1) and the negative-to-1 backstop — one
    # without the other changes nothing, since the freeze is what keeps the product positive.
    # Default false = today's validated behaviour, which the target output was reconciled against.
    # WARNING: with the freeze off, a run-off matrix keeps computing past the cliff instead of
    # holding its last good value flat, so its whole tail changes.
    allow_negative_ead_ra_rate = false

    # Debug: log a titled show() of inputs and a full per-term intermediate trace.
    debug = false

    # Pre-calculation technical control (input data-control gate). When strict=true a FAIL aborts the run
    # before any calculation; set false to log the DATA CONTROL report as warnings and proceed.
    validation {
      strict = true
    }
  }

  # Run audit — shared, module-agnostic execution history (com.bnp.str.utilities.audit).
  # Every run of every module in the jar records one row into the `run_history` EXTERNAL Hive
  # table, stored as ORC and PARTITIONED BY (module_name, run_id) at `root`. Launcher-supplied
  # metadata (run_id, user_launcher, motor, used_jar) may be given here, or injected per-run via
  # -Drun.userLauncher / -Drun.motor / -Drun.usedJar / RUN_USER_LAUNCHER / RUN_MOTOR / RUN_USED_JAR
  # (overrides these fallbacks).
  audit {
    enabled  = true
    database = "dbiris"                 # Hive db: registers dbiris.run_history and derives LOCATION
                                        #   from the db's warehouse dir (<db.locationUri>/run_history)
    table    = "run_history"            # external Hive table name (unqualified; qualified by `database`)
    root     = "localRun/run_history"   # fallback LOCATION when `database` is unset / metastore absent
    # runId        = "..."             # optional: pin the run_id (else a UUID is generated)
    userLauncher = "j03627"            # user who launched the run (given in the conf)
    motor        = "tseadfwd"          # compute motor/engine
    # usedJar     = "str-file-transform-engine-1.0-RELEASE.jar"  # else auto-detected (see note); on YARN
    #                                                            #   cluster set it here as it localizes
    #                                                            #   the jar as __app__.jar
  }

  # EAD FWD Term Structure output
  #
  # Primary output is the ';'-delimited CSV (as before). With alsoExcel = true, the SAME
  # term structure is ALSO written as a single .xlsx workbook (via crealytics spark-excel)
  # alongside it — $tableName.csv AND $tableName.xlsx — e.g. to hand off to another team.
  TS_EAD_FWD {
    format = "csv"
    mode = "overwrite"
    numPartition = 1
    tmpPath = "localRun/tseadfwd/output"
    tableName = "TS_EAD_FWD_25Q4_v1_small"
    # collapse the Spark part-file directory into a single clean $tableName.csv
    singleFile = true
    # also emit $tableName.xlsx with the identical data (cells written as TEXT)
    alsoExcel = true
    # worksheet name inside the .xlsx (defaults to tableName when omitted)
    sheetName = "TS_EAD_FWD"
  }

  # Business coherence checks on the TS_EAD_FWD output (com.bnp.str.tseadfwd.coherence).
  #
  # The rules only REPORT; the row removal is done by the main job on the frame it is about to
  # write. Every run of MainDriver produces the HTML report below; CoherenceCheckDriver regenerates it
  # from an already produced CSV (report only, never touches the data).
  COHERENCE_CHECK {
    # When false: no rules, no report, every computed row is written.
    enabled = true

    # Self-contained HTML report (local or HDFS path — written through Hadoop's FileSystem).
    htmlPath = "localRun/tseadfwd/output/CR_TS_EAD_FWD.html"

    # CoherenceCheckDriver only: the produced CSV to inspect. Defaults to the TS_EAD_FWD output file.
    sourcePath = "localRun/tseadfwd/output/TS_EAD_FWD_25Q4_v1_small.csv"

    rules {
      # CR01 — lines are grouped BY EAD_MATRIX_ID AND SCENARIO_ID (one group = one curve). A group
      # whose every term equals 1 is full exposure throughout: the line carries no information, so
      # it is removed from the output and listed in the report. A single term below 1 keeps the
      # whole group. EAD_MATRIX_ID ends in _Q / _Y, so a matrix's quarterly and yearly curves are
      # two separate groups. Set remove = false to keep the lines and only report them.
      all_terms_equal_one {
        enabled   = true
        remove    = true
        # |value - 1| <= tolerance counts as "equal to 1".
        tolerance = 1e-9
      }

      # CR02 — negative EAD_RA_RATE (an exposure factor must lie between 0 and 1). The LINE is always
      # kept: the term exists, and dropping it would leave a hole in the curve. NOTE: this reports
      # nothing unless parameters.allow_negative_ead_ra_rate is true — otherwise a sub-zero factor is
      # emitted as 1 and never reaches the output.
      negative_ead_ra_rate {
        enabled         = true
        # Widen the rule from "strictly negative" to "negative OR zero". A zero rate is not
        # impossible the way a negative one is — it is the exposure fully run off — but the
        # business asked for those terms to be named in the report too. The LINE IS STILL KEPT:
        # this rule only ever reports (see `removes = false` on CR02), so switching this on adds
        # findings to the report and changes nothing in the CSV.
        # Default false = the historical strictly-negative scope.
        includeZero     = true
        # Empty (default): the output carries the negative value AS COMPUTED. A negative rate can
        # only appear once parameters.allow_negative_ead_ra_rate is on, and the point of switching
        # that on is to see the real number — masking it here would hide exactly what was asked for.
        # Set a token (e.g. "NV") only for a consumer that cannot take a negative number.
        # WARNING: a token makes the cell non-numeric. Readers of TS_EAD_FWD must then tolerate it —
        # the in-repo jobs (EadFwdCompare, Term0/Year analysis) do, an external consumer may not.
        replaceWith     = ""
        # cap on the rows LISTED in the report; the count is always complete
        maxRowsInReport = 500
      }
    }
  }

  # Term0AnalysisDriver job — auto-generates the EAD_RA_RATE computation breakdown per
  # (matrix, scenario) at a configurable set of terms, as a Markdown narrative + decimal-comma CSV.
  TERM0_ANALYSIS {
    # Generation gate: when false the job does nothing.
    enabled = true
    # Output terms to break down (quarterly grid; term 0 = Q1). Edit freely.
    terms   = [0, 0.25, 0.5, 1, 2, 5, 10, 30]
    # Optional: reconcile each analysis EAD against the REAL engine output (TS_EAD_FWD). When set,
    # the CSV/MD gain ENGINE_EAD + STATUS (MATCH/DIFF/MISSING) so a bad input parse shows as DIFF.
    enginePath = "localRun/tseadfwd/output/TS_EAD_FWD_25Q4_v1_small.csv"
    # Abs-error threshold counted as a MATCH during reconciliation.
    tol     = 1e-6
    # Outputs are written through Hadoop's FileSystem, so these may be local paths (as below) or
    # HDFS paths, e.g. mdPath = "hdfs:///user/tseadfwd/analysis/ANALYSIS_TERM0_GENERATED.md".
    mdPath  = "localRun/tseadfwd/output_analysis/ANALYSIS_TERM0_GENERATED.md"
    csvPath = "localRun/tseadfwd/output_analysis/ANALYSIS_TERM0_GENERATED.csv"
  }

  # YearAnalysisDriver job — same breakdown as TERM0_ANALYSIS but on the YEARLY grid (term step 1,
  # term 0 = Y1; yearly RA = SUM over window, CRD = MEAN). Same keys as TERM0_ANALYSIS.
  YEAR_ANALYSIS {
    # Generation gate: when false the job does nothing.
    enabled = true
    # Output terms to break down, interpreted as YEARS (yearly grid; term 0 = Y1). Edit freely.
    terms   = [0, 1, 2, 3, 5, 10, 30]
    # Optional: reconcile each analysis EAD against the REAL engine output (TS_EAD_FWD). When set,
    # the CSV/MD gain ENGINE_EAD + STATUS (MATCH/DIFF/MISSING) so a bad input parse shows as DIFF.
    enginePath = "localRun/tseadfwd/output/TS_EAD_FWD_25Q4_v1_small.csv"
    # Abs-error threshold counted as a MATCH during reconciliation.
    tol     = 1e-6
    # Outputs are written through Hadoop's FileSystem, so these may be local or HDFS paths.
    mdPath  = "localRun/tseadfwd/output_analysis/ANALYSIS_YEAR_GENERATED.md"
    csvPath = "localRun/tseadfwd/output_analysis/ANALYSIS_YEAR_GENERATED.csv"
  }

  # RA input comparison report (ticket 977) - com.bnp.str.tseadfwd.job.CompareAndReportDriver.
  #
  # Compares TWO INPUTS_RA workbooks and writes the %change of the four metrics for every perimeter
  # and segment they share, over the three stress legs and every month, with a chart per
  # (metric x segment). Reads the input workbooks only - it changes nothing in the production run.
  #
  # The RA sheets of each workbook are found with the SAME two gates the engine uses (the `RA` block
  # above: sheetPattern on the name, requireColumns on the content), so a tab the engine skips is
  # skipped here too.
  COMPARE_AND_REPORT {
    # When false the job does nothing.
    enabled = true

    # The two workbooks. `new` is the file about to be used, `old` the previous reference.
    newPath = "localRun/tseadfwd/input/Inputs_RA_v4.xlsx"
    oldPath = "localRun/tseadfwd/input/Inputs_RA_v3.xlsx"

    # What each side is called in the report.
    newLabel = "Updated"
    oldLabel = "Previous"

    # Empty = every perimeter common to both files. Name a subset to narrow the report.
    perimeters = []

    # Table display order inside a sheet. A segment NOT named here still appears - after these,
    # alphabetically - so a segment added to INPUTS_RA is never silently left out of the report.
    segmentOrder = ["MORTGAGE", "INVEST_PRO", "INVEST_CORP", "CONSO"]

    # The deliverable.
    xlsxPath = "localRun/tseadfwd/output/Compare_RA.xlsx"

    # Optional flat per-cell CSV, for reconciling the report against a manual calculation:
    # PERIMETER;SEGMENT;RATE_TYPE;FWL_TYPE;METRIC;MONTH;NEW;OLD;PCT_CHANGE;STATUS
    csvPath = "localRun/tseadfwd/output/Compare_RA.csv"

    # true wraps every Evol formula in IFERROR so a division by zero shows as a blank cell;
    # false writes the bare =(B4-B32)/B32 and lets Excel show #DIV/0!, as the manual file does.
    safeDiv = true
  }

  # EadFwdCompare job — compares an output CSV against a target CSV and writes a per-key result CSV.
  COMPARE {
    outputPath    = "localRun/tseadfwd/output/TS_EAD_FWD_25Q4_v1_small.csv"
    targetPath    = "localRun/tseadfwd/target_output/TS_EAD_FWD_25Q4_v1_small.csv"
    # drop the RATE_TYPE token from the output id (BCEF_CONSO_TF_Q -> BCEF_CONSO_Q) to align
    # with a target that omits it
    stripRateType = true
    # abs-error threshold counted as "matching"
    tol           = 1e-6
    # per-key comparison CSV (EAD_MATRIX_ID;SCENARIO_ID;TERM;OUTPUT;TARGET;ABS_ERROR;STATUS)
    comparePath   = "localRun/tseadfwd/output/COMPARE_TS_EAD_FWD.csv"
  }
}
