# Main configuration section for the addons application
addons_app {

  # Configuration for add_on_application business object (source data)
  add_on_application {
    # Path to the input Excel file containing the data
    path = "localRun/addons/input/Copie de ADD_ON_Q22024.xlsx"
    # Name of the sheet in the Excel file that contains the add_on_application data
    sheetNames = r_add_on_application
  }

  # Configuration for add_on_action business object (source data)
  add_on_action {
    # Path to the input Excel file containing the data
    path = "localRun/addons/input/Copie de ADD_ON_Q22024.xlsx"
    # Name of the sheet in the Excel file that contains the add_on_action data
    sheetNames = r_add_on_action
    # Decimal columns to normalize to locale-independent form ('.' decimal, no grouping) on read,
    # so a comma-decimal host (e.g. fr-FR "-0,05") yields the same value as en-US ("-0.05").
    columnsToFix = ["FACTOR"]
  }

  # Configuration for add_on_perimeter business object (source data)
  add_on_perimeter {
    # Path to the input Excel file containing the data
    path = "localRun/addons/input/Copie de ADD_ON_Q22024.xlsx"
    # Name of the sheet in the Excel file that contains the add_on_perimeter data
    sheetNames = r_add_on_perimeter
  }

  # Configuration for crr_param_add_on_ste target data
  crr_param_add_on_ste {
    # Flag to enable/disable writing this output file
    enable = true
    # File format for the output (options: orc, parquet, csv, json, etc.)
    format = "csv"
    # Base output path where the final processed files will be stored
    path = "localRun/addons/output/"
    # Temporary path used during processing before final output
    tmpPath = "localRun/addons/output_tmp/"
    # Base name for the output table/file (quarter and date will be appended)
    tableName = "crr_param_add_on_ste"
    # Number of partitions to use when writing the output
    numPartition = 1
    # Write mode (options: Overwrite, Append, Ignore, ErrorIfExists)
    mode = "Overwrite"
    # Delimiter character for text-based formats (e.g., CSV)
    delimiter = ";"
    # Flag to include header row in text-based formats
    header = "true"
    # Flag to delete the temporary path after processing is complete
    deleteTmpPath = "true"
    queryName=""
  }

  sql_queries {
    # Path to the file containing SQL queries
    path = "localRun/addons/sql/queries.sql.conf"
  }

}
